name: Model Eğitimi (Veri Değiştiğinde)

on:
  push:
    paths:
      - 'data/train.dvc'  # SADECE veri takip dosyası değişirse çalışır!
      - 'dvc.yaml'        # Veya pipeline değişirse çalışır.
  
  # Manuel tetikleme butonu ekler (İstediğin zaman elle başlatmak için)
  workflow_dispatch: 

jobs:
  train-and-report:
    runs-on: ubuntu-latest
    container: docker://ghcr.io/iterative/cml:0-dvc2-base1
    
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v3

      - name: Python Bağımlılıklarını Kur
        run: |
          pip install -r requirements-train.txt

      - name: AWS S3 Erişim Ayarları (GitHub Secrets'tan alacak)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          dvc remote modify --local myremote access_key_id $AWS_ACCESS_KEY_ID
          dvc remote modify --local myremote secret_access_key $AWS_SECRET_ACCESS_KEY

      - name: Veriyi Çek (DVC Pull)
        run: dvc pull

      - name: Modeli Eğit (DVC Repro)
        run: dvc repro

      - name: Rapor Oluştur (CML)
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Metrikleri ve Grafikleri Rapora Ekle
          echo "## 📊 Model Eğitim Raporu" >> report.md
          echo "### Metrikler" >> report.md
          dvc metrics show >> report.md
          
          echo "### Grafikler" >> report.md
          # (Eğer dvc plots kullanıyorsan buraya grafik ekleme kodu gelir)
          
          cml comment create report.md