version: '3.8'

services:
  # 1. BACKEND SERVİSİ
  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    container_name: pet_backend
    ports:
      - "${BACKEND_PORT}:8000"  # Portu .env'den alıyor
    volumes:
      - ./models:/app/models
      - ./app/backend/gallery:/app/app/backend/gallery
    env_file:  # <---  Tüm .env değişkenlerini içeri aktarır
      - .env
    environment:
      - CUDA_VISIBLE_DEVICES=-1
      - PYTHONUNBUFFERED=1
    networks:
      - pet_network
    depends_on:
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy

  # 2. FRONTEND SERVİSİ
  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
    container_name: pet_frontend
    ports:
      - "${FRONTEND_PORT}:8501"
    volumes:
      - ./app/frontend:/app/app/frontend
    env_file:
      - .env
    environment:
      - API_URL=${API_URL}
    depends_on:
      - backend
    networks:
      - pet_network

  # 3. QDRANT
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pet_qdrant
    ports:
      - "${QDRANT_PORT}:6333"
    volumes:  
      - ./qdrant_storage:/qdrant/storage
    networks:
      - pet_network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 4. MINIO
  minio:
    image: minio/minio
    container_name: pet_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    # MinIO, env dosyasındaki değişkenleri otomatik tanır
    command: server /data --console-address ":9001"
    volumes:  
      - ./minio_data:/data
    networks:
      - pet_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

networks:
  pet_network:
    driver: bridge

volumes:
  minio_data:
  qdrant_storage: