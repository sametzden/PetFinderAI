version: '3.8'

services:
  # 1. BACKEND SERVİSİ (FastAPI)
  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    container_name: pet_backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./app/backend/gallery:/app/app/backend/gallery
    environment:
      - CUDA_VISIBLE_DEVICES=-1
      - PYTHONUNBUFFERED=1
    networks:
      - pet_network
    depends_on:
      qdrant:
        condition: service_healthy  # Qdrant'ın "hazırım" demesini bekler
      minio:
        condition: service_healthy  # MinIO'nun "hazırım" demesini bekler

  # 2. FRONTEND SERVİSİ (Streamlit)
  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
    container_name: pet_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./app/frontend:/app/app/frontend
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - pet_network

  # 3. VEKTÖR VERİTABANI (Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pet_qdrant
    ports:
      - "6333:6333"
    volumes:  
      - ./qdrant_storage:/qdrant/storage
    networks:
      - pet_network
    
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 4. DOSYA DEPOLAMA (MinIO)
  minio:
    image: minio/minio
    container_name: pet_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:  
      - ./minio_data:/data
    networks:
      - pet_network
    # --- MINIO İÇİN DE SAĞLIK KONTROLÜ EKLEDİK ---
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

networks:
  pet_network:
    driver: bridge

volumes:
  minio_data:
  qdrant_storage: # Burayı da volumes altına ekledim ki hata vermesin