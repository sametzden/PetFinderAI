version: '3.8'

services:
  # 1. BACKEND SERVİSİ (FastAPI)
  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    container_name: pet_backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./app/backend/gallery:/app/app/backend/gallery
    environment:
      - CUDA_VISIBLE_DEVICES=-1
      - PYTHONUNBUFFERED=1
    networks:
      - pet_network
    # YENİ: Sadece "başlatma" değil, "sağlıklı olmasını bekle" diyoruz
    depends_on:
      qdrant:
        condition: service_healthy
      minio:
        condition: service_started
  # 2. FRONTEND SERVİSİ (Streamlit)
  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
    container_name: pet_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./app/frontend:/app/app/frontend
    environment:
      # Docker içinde backend'e 'localhost' diyemeyiz, servis adını (backend) kullanırız
      - API_URL=http://backend:8000
    depends_on:
      - backend                           # Backend açılmadan Frontend açılmasın
    networks:
      - pet_network

  # 3. DEPOLAMA SERVİSİ (MinIO - İlerisi için)
  minio:
    image: minio/minio
    container_name: pet_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - pet_network

  # 4. VEKTÖR VERİTABANI (Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pet_qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    networks:
      - pet_network
    # YENİ: Qdrant'ın yaşayıp yaşamadığını kontrol eden mekanizma
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"] 
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  pet_network:
    driver: bridge

volumes:
  minio_data: